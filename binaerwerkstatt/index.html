<title>Binärwerkstatt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Sora:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: Karopapier-Heft. Oben Stationsleiste, darunter eine Station als Arbeitsfläche; Bauen = Skript links, Bausteinkiste + Bühne rechts. */
:root {
  --paper: #f6f8fc; --grid: #e1e7f2; --card: #ffffff; --ink: #1b2747; --muted: #5a6585;
  --line: #ccd5e6; --accent: #2f45c4; --accent-ink: #ffffff; --lamp: #ffbd1f; --lamp-glow: rgba(255, 189, 31, .45);
  --ok: #1f8a4c; --ok-bg: #e3f5ea; --bad: #c2362b; --bad-bg: #fbe8e6; --note-bg: #fff6d9; --note-line: #e8c65a;
  --b-event: #0f8778; --b-sense: #2a86cf; --b-look: #7657d0; --b-var: #db5f33; --b-ctrl: #e0a92a; --b-ctrl-ink: #2b2104; --b-op: #46934d;
  --slot: rgba(47, 69, 196, .07); --slot-line: #8d9bd8;
  --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121829; --grid: #1c2439; --card: #1a2236; --ink: #e8edf9; --muted: #a2acc6; --line: #2e3a57;
  --accent: #8ea0ff; --accent-ink: #0e1430; --lamp: #ffc93f; --lamp-glow: rgba(255, 201, 63, .35);
  --ok: #5fd18e; --ok-bg: #173326; --bad: #ff8a7d; --bad-bg: #3a1d1b; --note-bg: #2e2915; --note-line: #7a6624;
  --b-event: #13a090; --b-sense: #3a95dd; --b-look: #8a6fe0; --b-var: #e8714a; --b-ctrl: #e6b23a; --b-ctrl-ink: #2b2104; --b-op: #55a95d;
  --slot: rgba(142, 160, 255, .08); --slot-line: #6576c8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #121829; --grid: #1c2439; --card: #1a2236; --ink: #e8edf9; --muted: #a2acc6; --line: #2e3a57;
  --accent: #8ea0ff; --accent-ink: #0e1430; --lamp: #ffc93f; --lamp-glow: rgba(255, 201, 63, .35);
  --ok: #5fd18e; --ok-bg: #173326; --bad: #ff8a7d; --bad-bg: #3a1d1b; --note-bg: #2e2915; --note-line: #7a6624;
  --b-event: #13a090; --b-sense: #3a95dd; --b-look: #8a6fe0; --b-var: #e8714a; --b-ctrl: #e6b23a; --b-ctrl-ink: #2b2104; --b-op: #55a95d;
  --slot: rgba(142, 160, 255, .08); --slot-line: #6576c8; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; color: var(--ink); font: 17px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 1.75rem; font-weight: 800; }
h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Kopf */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 2px solid var(--line); padding-block: 12px 10px; margin-bottom: 22px; }
.top-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-bits { display: flex; gap: 3px; }
.brand-bits i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); display: block; }
.brand-bits i.on { background: var(--lamp); box-shadow: 0 0 8px var(--lamp-glow); }
.brand h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: -.01em; }
.brand small { color: var(--muted); font-size: .85rem; display: block; line-height: 1.1; }
.toggle { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: .9rem; font-weight: 700; }
.toggle[aria-pressed="true"] { border-color: var(--note-line); background: var(--note-bg); }
nav.stations { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; scrollbar-width: thin; }
nav.stations a { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--muted); border: 2px solid transparent; padding: 6px 12px 6px 8px; border-radius: 10px; font-weight: 700; font-size: .92rem; }
nav.stations a .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px solid var(--line); font-family: var(--f-mono); font-size: .8rem; color: var(--ink); }
nav.stations a.done .n { background: var(--lamp); border-color: var(--lamp); color: #2b2104; }
nav.stations a[aria-current="page"] { color: var(--ink); border-color: var(--accent); background: var(--card); }

/* Station */
.station-head { display: grid; gap: 8px; margin-bottom: 18px; max-width: 760px; }
.eyebrow { font-family: var(--f-mono); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.lead { font-size: 1.08rem; color: var(--muted); }
.panel { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 880px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 14px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 8px 16px; border-radius: 10px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.go { background: var(--ok); border-color: var(--ok); color: #fff; }
.next-row { display: flex; justify-content: flex-end; margin-top: 18px; }
.msg { border-radius: 10px; padding: 10px 14px; font-weight: 700; }
.msg.ok { background: var(--ok-bg); color: var(--ok); }
.msg.bad { background: var(--bad-bg); color: var(--bad); }
.msg.info { background: var(--slot); color: var(--ink); font-weight: 400; }
.insight { border-left: 5px solid var(--lamp); background: var(--card); padding: 12px 16px; border-radius: 0 12px 12px 0; }
.insight b { font-family: var(--f-display); }
details.q { border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--card); }
details.q summary { cursor: pointer; font-weight: 700; }
details.q p { margin-top: 8px; color: var(--muted); }

/* Lehrkraft-Hinweise */
.teacher { display: none; border: 2px dashed var(--note-line); background: var(--note-bg); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; }
body.teacher-on .teacher { display: grid; gap: 8px; }
.teacher h3 { font-size: 1rem; }
.teacher ul { margin: 0; padding-left: 20px; }
.teacher .meta { font-family: var(--f-mono); font-size: .82rem; color: var(--muted); }
.plan { width: 100%; border-collapse: collapse; font-size: .92rem; }
.plan th, .plan td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--note-line); vertical-align: top; }
.plan td:first-child { font-family: var(--f-mono); white-space: nowrap; }

/* Station 1: Bits */
.bits { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.bit { width: 112px; border: 3px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 8px 10px; cursor: pointer; display: grid; justify-items: center; gap: 8px; transition: border-color .15s; }
.bit .lamp { width: 54px; height: 54px; border-radius: 50%; background: var(--grid); border: 3px solid var(--line); transition: background .15s, box-shadow .15s; }
.bit[aria-pressed="true"] { border-color: var(--lamp); }
.bit[aria-pressed="true"] .lamp { background: var(--lamp); border-color: var(--lamp); box-shadow: 0 0 22px var(--lamp-glow); }
.bit .val { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; }
.bit .dig { font-family: var(--f-mono); font-weight: 700; font-size: 1.3rem; color: var(--muted); }
.bit[aria-pressed="true"] .dig { color: var(--ink); }
.readout { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; align-items: baseline; font-family: var(--f-mono); }
.readout .big { font-size: 2.1rem; font-weight: 700; letter-spacing: .08em; }
.readout .lbl { font-family: var(--f-body); color: var(--muted); font-size: .9rem; display: block; letter-spacing: 0; }
.challenge { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.target { font-family: var(--f-display); font-size: 1.25rem; font-weight: 800; }
.dots { display: flex; gap: 6px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block; }
.dots i.on { background: var(--ok); }

/* Station 2: Rezept-Tabelle */
.rec { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rec th, .rec td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
.rec th { font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.rec td.m { font-family: var(--f-mono); font-weight: 700; }
.digits { display: flex; gap: 6px; font-family: var(--f-mono); font-size: 1.8rem; font-weight: 700; }
.digits span { width: 44px; height: 54px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 10px; background: var(--card); }
.digits span.cur { border-color: var(--lamp); box-shadow: 0 0 0 3px var(--lamp-glow); }
.digits span.used { color: var(--muted); }
input.field { font: 700 1.1rem var(--f-mono); padding: 7px 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); width: 9ch; }
input.field.wide { width: 14ch; }
.recipe { font-family: var(--f-mono); background: var(--slot); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }

/* Blöcke */
.script { display: grid; justify-items: start; gap: 0; padding: 6px 0; overflow-x: auto; }
.blk { position: relative; display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; min-height: 42px; padding: 6px 12px; color: #fff; font-weight: 700; font-size: .98rem; border-radius: 6px; margin-top: 4px; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18); }
.blk::before { content: ""; position: absolute; top: -1px; left: 16px; width: 22px; height: 6px; border-radius: 0 0 6px 6px; background: rgba(0, 0, 0, .18); }
.blk.hat { border-radius: 18px 18px 6px 6px; padding-top: 12px; }
.blk.hat::before { display: none; }
.c-wrap { display: grid; justify-items: start; margin-top: 4px; }
.c-wrap > .blk { margin-top: 0; border-radius: 6px 6px 6px 0; }
.c-body { display: grid; justify-items: start; padding: 2px 0 6px 18px; border-left: 18px solid var(--b-ctrl); min-height: 30px; min-width: 120px; }
.c-foot { width: 130px; height: 18px; background: var(--b-ctrl); border-radius: 0 0 6px 6px; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18); }
.cat-event { background: var(--b-event); } .cat-sense { background: var(--b-sense); } .cat-look { background: var(--b-look); }
.cat-var { background: var(--b-var); } .cat-op { background: var(--b-op); }
.cat-ctrl { background: var(--b-ctrl); color: var(--b-ctrl-ink); }
.rep { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: .92rem; color: #fff; border: 2px solid rgba(0, 0, 0, .18); }
.lit { display: inline-block; min-width: 30px; text-align: center; padding: 2px 9px; border-radius: 999px; background: #fff; color: #1b2747; font-family: var(--f-mono); font-weight: 700; font-size: .9rem; }
.lit.txt { border-radius: 5px; }
.tray > .piece > .lit { border: 2px solid var(--b-op); padding: 6px 14px; font-size: 1rem; }
.flag { color: #8ff0a4; font-size: 1.15rem; line-height: 1; }
.slot { border: 2px dashed var(--slot-line); background: var(--slot); color: var(--muted); border-radius: 8px; cursor: pointer; font-weight: 700; font-size: .85rem; display: inline-flex; align-items: center; justify-content: center; }
.slot.s-stmt { min-width: 230px; min-height: 42px; margin-top: 6px; padding: 4px 10px; }
.slot.s-expr { min-width: 64px; min-height: 30px; border-radius: 999px; padding: 0 8px; background: rgba(255, 255, 255, .85); color: #4b5675; border-color: rgba(0, 0, 0, .3); }
.slot.filled { border: none; background: transparent; padding: 0; min-width: 0; min-height: 0; margin-top: 0; }
.slot.filled.s-stmt { margin-top: 0; }
.slot.hot { border-color: var(--lamp); background: var(--lamp-glow); }
.slot.ok > * { outline: 3px solid var(--ok); outline-offset: 2px; }
.slot.bad > * { outline: 3px solid var(--bad); outline-offset: 2px; }
.slot.bad:not(.filled) { border-color: var(--bad); }
.piece { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.piece.sel > .blk, .piece.sel > .rep, .piece.sel > .c-wrap > .blk { outline: 3px solid var(--lamp); outline-offset: 3px; }
.drag-ghost { position: fixed; z-index: 50; pointer-events: none; opacity: .9; transform: rotate(-2deg); filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .25)); }
.run-hl { outline: 4px solid var(--lamp) !important; outline-offset: 2px; box-shadow: 0 0 18px var(--lamp-glow); }
.tray { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-start; min-height: 70px; padding: 10px; border: 2px dashed var(--line); border-radius: 12px; }
.tray.hot { border-color: var(--lamp); }
.tray-empty { color: var(--muted); font-size: .9rem; }
.pick { cursor: pointer; }
.pick:hover { filter: brightness(1.1); }
.found { outline: 4px solid var(--bad) !important; outline-offset: 2px; }

/* Bühne */
.stage { position: relative; border: 2px solid var(--line); border-radius: 12px; min-height: 230px; background: var(--paper); display: grid; place-items: end center; padding: 14px; overflow: hidden; }
.robot { width: 120px; height: 130px; }
.robot .lampx { fill: var(--line); transition: fill .2s; }
.stage.running .robot .lampx { fill: var(--lamp); }
.bubble { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 28px); background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 8px 14px; font-weight: 700; font-size: 1.05rem; text-align: center; }
.bubble::after { content: ""; position: absolute; bottom: -10px; left: 50%; width: 16px; height: 16px; background: var(--card); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
.bubble .num { font-family: var(--f-mono); }
.askbar { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 8px; background: var(--card); border: 2px solid var(--b-sense); border-radius: 12px; padding: 6px; }
.askbar input { flex: 1; min-width: 0; font: 700 1.1rem var(--f-mono); border: none; background: transparent; color: var(--ink); padding: 4px 8px; }
.monitors { display: flex; gap: 8px; flex-wrap: wrap; }
.mon { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--card); border-radius: 8px; padding: 3px 4px 3px 10px; font-size: .9rem; font-weight: 700; }
.mon b { background: var(--b-var); color: #fff; font-family: var(--f-mono); border-radius: 6px; padding: 1px 9px; min-width: 34px; text-align: center; transition: transform .15s; }
.mon b.flash { transform: scale(1.25); }
.log { font-family: var(--f-mono); font-size: .86rem; max-height: 168px; overflow: auto; border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--card); display: grid; gap: 2px; }
.log:empty::before { content: "Hier erscheint das Protokoll, sobald das Programm läuft."; color: var(--muted); font-family: var(--f-body); }
select.field { font: 700 .95rem var(--f-body); padding: 7px 8px; border: 2px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }

/* Etappen, Begriffe, Tests */
.steps { display: flex; gap: 8px; flex-wrap: wrap; }
.steps button { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 14px; font-weight: 700; cursor: pointer; font-size: .9rem; }
.steps button[aria-current="step"] { border-color: var(--accent); color: var(--accent); }
.steps button.done::before { content: "✓ "; color: var(--ok); }
.terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.term { display: grid; gap: 8px; align-content: start; }
.term .where { font-size: .82rem; color: var(--muted); font-family: var(--f-mono); }
.tests { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.test { border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; font-family: var(--f-mono); display: flex; justify-content: space-between; gap: 8px; }
.test.pass { border-color: var(--ok); background: var(--ok-bg); }
.test.fail { border-color: var(--bad); background: var(--bad-bg); }
.cases { display: flex; gap: 8px; flex-wrap: wrap; }
.find-table { width: 100%; border-collapse: collapse; font-size: .95rem; }
.find-table td, .find-table th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tw { overflow-x: auto; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <div class="brand-bits" aria-hidden="true"><i class="on"></i><i></i><i class="on"></i><i class="on"></i></div>
        <div><h1>Binärwerkstatt</h1><small>Wir bauen einen Binärrechner aus Blöcken · Mathe Klasse 9</small></div>
      </div>
      <button class="toggle" id="teacherToggle" aria-pressed="false" type="button">Lehrkraft-Hinweise</button>
    </div>
    <nav class="stations" id="nav" aria-label="Stationen"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<script>
"use strict";
/* ============================================================ Hilfen */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const store = {
  get() { try { return JSON.parse(localStorage.getItem("binaerwerkstatt") || "{}"); } catch { return {}; } },
  set(p) { try { localStorage.setItem("binaerwerkstatt", JSON.stringify(Object.assign(store.get(), p))); } catch {} },
};
const state = Object.assign({ done: {}, teacher: false }, store.get());
function markDone(id) { state.done[id] = true; store.set({ done: state.done }); renderNav(); }

/* ============================================================ Block-Modell */
const flag = () => ({ k: "flag" });
const ask = q => ({ k: "ask", q });
const say = v => ({ k: "say", v });
const set = (name, v) => ({ k: "set", name, v });
const change = (name, by) => ({ k: "change", name, by });
const rep = (n, body) => ({ k: "repeat", n, body });
const slot = id => ({ k: "slot", id });
const num = v => ({ k: "num", v: String(v) });
const str = v => ({ k: "str", v });
const vr = name => ({ k: "var", name });
const ans = () => ({ k: "answer" });
const len = s => ({ k: "len", s });
const letter = (i, s) => ({ k: "letter", i, s });
const add = (a, b) => ({ k: "add", a, b });
const mul = (a, b) => ({ k: "mul", a, b });
const join = (a, b) => ({ k: "join", a, b });
const eslot = id => ({ k: "eslot", id });
const STMT = new Set(["flag", "ask", "say", "set", "change", "repeat", "slot"]);
const isStmt = n => STMT.has(n.k);
const bug = n => (n.bug = true, n);

/* Darstellung. ctx: { map (WeakMap Knoten→Element), slotEl(node, kind) , pick(node) } */
function rExpr(n, ctx) {
  if (!n) return h("span", { class: "slot s-expr" }, " ");
  let e;
  switch (n.k) {
    case "eslot": return ctx.slotEl(n, "expr");
    case "num": e = h("span", { class: "lit" }, n.v); break;
    case "str": e = h("span", { class: "lit txt" }, n.v); break;

  }
  show(bugIdx);
  return [teacherBox("fehler"), head(i, "Fehlerjagd", "Diese vier Rechner sehen fast richtig aus, haben aber jeweils einen Fehler. Teste sie mit verschiedenen Zahlen und finde den falschen Block."), h("div", { class: "stack" }, tabs, box), nextBtn(i)];
}

/* ---------- Station 6 */
function sFertig(i) {
  const tests = [["0", 0], ["1", 1], ["10", 2], ["111", 7], ["1011", 11], ["10000", 16], ["11111111", 255]];
  const res = state.tests || {};
  const prog = FINAL(); const map = new WeakMap();
  const testEls = tests.map(([inp, out]) => h("div", { class: "test" + (res[inp] ? " pass" : "") }, h("span", {}, inp), h("span", {}, res[inp] ? `= ${out} ✓` : "?")));
  const runner = new Runner({ getEl: n => map.get(n), onFinish: r => {
    const t = tests.findIndex(([inp]) => inp === r.answer);
    if (t < 0) return;
    const ok = String(r.said) === String(tests[t][1]);
    testEls[t].className = "test " + (ok ? "pass" : "fail");
    testEls[t].lastChild.textContent = ok ? `= ${tests[t][1]} ✓` : `≠ ${r.said}`;
    if (ok) { res[tests[t][0]] = true; store.set({ tests: res }); }
    if (tests.every(([inp]) => res[inp])) markDone("fertig");
  } });
  runner.setScript(() => prog);
  const ctx = { map, slotEl: () => null };
  const rows = [["Wenn ⚑ angeklickt wird", "Ereignisse"], ["frage … und warte, Antwort", "Fühlen"], ["setze … auf, ändere … um, Ergebnis, Stelle", "Variablen (vorher „Neue Variable“ anlegen)"],
    ["wiederhole … mal", "Steuerung"], ["+, *, Zeichen … von …, Länge von …", "Operatoren"], ["sage …", "Aussehen"]];
  return [teacherBox("fertig", h("div", {}, h("h3", {}, "Ablauf der Reihe (2 Doppelstunden)"), h("div", { class: "tw" }, h("table", { class: "plan" }, h("tbody", {}, PLAN.map(([a, b]) => h("tr", {}, h("td", {}, a), h("td", {}, b)))))),
    h("p", { class: "meta", style: "margin-top:8px" }, "Bezug: KLP Mathematik Gesamtschule NRW, Inhaltsfeld Arithmetik/Algebra (Stellenwertsysteme) und die prozessbezogenen Kompetenzen Operieren, Problemlösen, Argumentieren. Medienkompetenzrahmen NRW, Bereich 6: Problemlösen und Modellieren (6.2 Algorithmen erkennen, 6.3 Modellieren und Programmieren)."))),
    head(i, "Fertig und getestet?", "Das ist der fertige Binärrechner. Teste ihn mit allen Zahlen aus dem Testprotokoll. Ein Feld wird grün, wenn der Rechner richtig gerechnet hat."),
    h("div", { class: "grid2" },
      h("div", { class: "stack" }, h("div", { class: "panel stack" }, h("h3", {}, "Der Binärrechner"), renderScript(prog, ctx)),
        h("div", { class: "panel stack" }, h("h3", {}, "Testprotokoll"), h("div", { class: "tests" }, testEls))),
      h("div", { class: "panel stack" }, h("h3", {}, "Bühne"), runner.el)),
    h("div", { class: "grid2", style: "margin-top:18px" },
      h("div", { class: "panel stack" }, h("h3", {}, "Exit-Ticket: drei Fragen"),
        h("details", { class: "q" }, h("summary", {}, "1. Was zeigt der Rechner bei 110? Rechne mit dem Rezept."), h("p", {}, "6. Ergebnis: 0 → 0·2+1 = 1 → 1·2+1 = 3 → 3·2+0 = 6.")),
        h("details", { class: "q" }, h("summary", {}, "2. Wozu braucht der Rechner die Variable Stelle?"), h("p", {}, "Sie merkt sich, welche Ziffer gerade gelesen wird. Ohne sie würde der Rechner immer nur die erste Ziffer lesen.")),
        h("details", { class: "q" }, h("summary", {}, "3. Warum steht „setze Ergebnis auf 0“ vor der Schleife und nicht darin?"), h("p", {}, "In der Schleife würde das Ergebnis vor jeder Ziffer gelöscht, und es bliebe nur die letzte Ziffer übrig. Davor wird es nur einmal am Anfang auf 0 gesetzt."))),
      h("div", { class: "panel stack" }, h("h3", {}, "Jetzt in echtem Scratch"),
        h("p", {}, "Öffne den Scratch-Editor (", h("a", { href: "https://scratch.mit.edu/projects/editor/", target: "_blank", rel: "noopener" }, "scratch.mit.edu"), "), lege die Variablen „Ergebnis“ und „Stelle“ an und baue das Skript nach. Hier findest du die Blöcke:"),
        h("div", { class: "tw" }, h("table", { class: "find-table" }, h("thead", {}, h("tr", {}, h("th", {}, "Block"), h("th", {}, "Kategorie"))), h("tbody", {}, rows.map(([a, b]) => h("tr", {}, h("td", {}, a), h("td", {}, b)))))),
        h("details", { class: "q" }, h("summary", {}, "Expertenaufgabe: Dezimal → Dual"), h("p", {}, "Baue einen zweiten Rechner, der eine Dezimalzahl in eine Dualzahl umwandelt. Rezept: Teile die Zahl immer wieder durch 2. Der Rest (0 oder 1) wird vorne an die Dualzahl angehängt. Wiederhole das, bis die Zahl 0 ist. Du brauchst die Operatoren „mod“ (Rest), „abrunden von“ und „verbinde“."))))];
}

/* ============================================================ Navigation */
function renderNav() {
  const cur = currentId();
  $("#nav").replaceChildren(...STATIONS.map((s, i) => h("a", { href: "#" + s.id, class: state.done[s.id] ? "done" : "", "aria-current": s.id === cur ? "page" : null },
    h("span", { class: "n" }, state.done[s.id] ? "✓" : i + 1), s.label)));
}
function currentId() { const id = location.hash.slice(1); return STATIONS.some(s => s.id === id) ? id : "bits"; }
function route() {
  const id = currentId(); const i = STATIONS.findIndex(s => s.id === id);
  $("#main").replaceChildren(...STATIONS[i].render(i).filter(Boolean));
  renderNav(); window.scrollTo({ top: 0 });
}
const tt = $("#teacherToggle");
function applyTeacher() { document.body.classList.toggle("teacher-on", state.teacher); tt.setAttribute("aria-pressed", String(state.teacher)); }
tt.addEventListener("click", () => { state.teacher = !state.teacher; store.set({ teacher: state.teacher }); applyTeacher(); });
window.addEventListener("hashchange", route);
applyTeacher(); route();
</script>
